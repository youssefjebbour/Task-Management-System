spring:
  application:
    name: taskflow-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5436/taskflow}
    username: ${POSTGRES_USER:taskflow}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 12
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_TLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
server:
  port: ${API_PORT:8080}
  tomcat:
    max-swallow-size: 11MB
  error:
    include-message: never
  shutdown: graceful
management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true
  endpoint.health.show-details: never
app:
  jwt-secret: ${JWT_SECRET}
  access-token-minutes: 10
  refresh-token-days: 14
  cookie-secure: ${COOKIE_SECURE:false}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173}
  url: ${APP_URL:http://localhost:5173}
  zone: ${APP_ZONE:Asia/Shanghai}
  mail-from: ${MAIL_FROM:taskflow@localhost}
  uploads: ${UPLOAD_PATH:./uploads}
  seed-enabled: ${SEED_ENABLED:false}
  seed-password: ${SEED_PASSWORD:}
springdoc:
  swagger-ui.path: /docs
